[project]
name = "stem-splitter"
version = "0.1.0"
description = "Local AI stem separation with a multitrack mixer (Apple Silicon)"
authors = [
    { name = "Chelsan-s" }
]
requires-python = ">=3.12"
dependencies = [
    "audio-separator[cpu]>=0.48.0",
    "audioread>=3.1.0",
    "fastapi>=0.165.0",
    "librosa>=1.0.1",
    "mlx-whisper>=0.4.3",
    "python-multipart>=0.0.34",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
